[project]
name = "assistant"
version = "0.1.0"
description = "Offline modular personal AI assistant for Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2"]
voice = ["numpy", "vosk", "piper-tts", "openwakeword"]
screen = ["pygame-ce"]  # the face on the Pi's own screen (src/assistant/screen.py)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
